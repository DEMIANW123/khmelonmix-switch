name: Build Switch NRO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer el proyecto
        run: |
          unzip -q khmelonmix-switch-port.zip
          mv melonds-switch/* melonds-switch/.[!.]* . 2>/dev/null || true

      - name: Arreglar certificados y actualizar repositorios
        run: |
          # Esto arregla el error 403 actualizando las librerías de red internas del contenedor
          sudo apt-get update && sudo apt-get install -y ca-certificates
          dkp-pacman -Syu --noconfirm

      - name: Instalar dependencias de devkitPro
        run: |
          dkp-pacman -S --noconfirm --needed deko3d switch-lib_epoxy

      - name: Compilar
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake ..
          make -j$(nproc)

      - name: Subir el .nro resultante
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-KH-switch
          path: build/melonDS.nro
