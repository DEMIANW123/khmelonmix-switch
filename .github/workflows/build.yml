name: Build Switch NRO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer el proyecto
        run: |
          unzip -q khmelonmix-switch-port.zip
          mv melonds-switch/* melonds-switch/.[!.]* . 2>/dev/null || true
          sed -i 's/#include <unordered_set>/#include <unordered_set>\n#include <utility>/' src/teakra/src/interpreter.h
          sed -i 's/#include <arm_neon.h>/#include <arm_neon.h>\n#include <unordered_map>/' src/frontend/switch/ROMMetaDatabase.cpp
          sed -i 's/#include <optional>/#include <optional>\n#include <functional>/' src/frontend/switch/BoxGui.cpp
          sed -i 's/#include <deko3d.hpp>/#include <deko3d.hpp>\n#include <optional>/' src/frontend/switch/Gfx.cpp
          sed -i 's|#include "../../Platform.h"|#include "../../Platform.h"\n#include <functional>|' src/frontend/switch/Platform.cpp

      - name: Instalar dependencias de devkitPro
        run: |
          dkp-pacman -Sy --noconfirm --needed deko3d switch-glm switch-zlib switch-bzip2 switch-libjpeg-turbo switch-freetype switch-tools || true

      - name: Compilar
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/Toolchain-cross-Switch.cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_SDL=OFF -DENABLE_OGLRENDERER=OFF -DBUILD_SWITCH=ON ..
          make -j$(nproc)

      - name: Subir el .nro resultante
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-KH-switch
          path: build/melonDS.nro
